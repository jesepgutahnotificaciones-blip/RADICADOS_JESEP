<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulario Radicación</title>

<style>

body{
  font-family:Arial;
  background:#f1f3f4;
  padding:30px;
}

.contenedor{
  max-width:550px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#1a73e8;
  margin-bottom:25px;
}

.grupo{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:5px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#1a73e8;
  color:white;
  font-size:16px;
  border-radius:5px;
  cursor:pointer;
}

button:hover{
  background:#1558b0;
}

#resultado{
  margin-top:20px;
  padding:15px;
  border-radius:5px;
  text-align:center;
  display:none;
  font-size:18px;
}

.ok{
  background:#e6f4ea;
  color:#137333;
}

.error{
  background:#fce8e6;
  color:#c5221f;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>Formulario de Radicación</h1>

<div class="grupo">
<label>Asunto</label>
<input type="text" id="asunto">
</div>

<div class="grupo">
<label>Destinatario</label>
<input type="text" id="destinatario">
</div>

<div class="grupo">
<label>Grado</label>
<input type="text" id="grado">
</div>

<div class="grupo">
<label>Nombre quien Radica</label>
<input type="text" id="nombre">
</div>

<div class="grupo">
<label>Número Telefónico</label>
<input type="text" id="telefono">
</div>

<div class="grupo">
<label>Correo Dependencia</label>
<input type="email" id="correo">
</div>

<button onclick="enviar()" id="btnEnviar">

Enviar Información

</button>

<div id="resultado"></div>

</div>

<script>

async function enviar(){

  const boton =
    document.getElementById("btnEnviar");

  boton.disabled = true;

  boton.innerHTML = "Enviando...";

  const resultado =
    document.getElementById("resultado");

  const datos = {

    asunto:
      document.getElementById("asunto").value,

    destinatario:
      document.getElementById("destinatario").value,

    grado:
      document.getElementById("grado").value,

    nombre:
      document.getElementById("nombre").value,

    telefono:
      document.getElementById("telefono").value,

    correo:
      document.getElementById("correo").value

  };

  try {

    await fetch(
      "https://script.google.com/macros/s/AKfycbzRmDGn0yNkQ0hWLatvaf54ZZuJyDW6FycJpmZlonlhSRmhtUlh9WNqReTtD2lOJb1ikw/exec",
      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify(datos)

      }
    );

    resultado.style.display = "block";

    resultado.className = "ok";

    resultado.innerHTML =
      "Información enviada correctamente.";

    // LIMPIAR

    document.getElementById("asunto").value = "";
    document.getElementById("destinatario").value = "";
    document.getElementById("grado").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("correo").value = "";

  } catch(error){

    resultado.style.display = "block";

    resultado.className = "error";

    resultado.innerHTML =
      "Error enviando información.";

  }

  boton.disabled = false;

  boton.innerHTML = "Enviar Información";

}

</script>

</body>
</html>
