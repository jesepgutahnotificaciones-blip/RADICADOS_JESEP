<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>

    body{
      font-family: Arial;
      background:#f4f4f4;
      padding:20px;
    }

    .contenedor{
      background:white;
      max-width:500px;
      margin:auto;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:15px;
      border:none;
      border-radius:5px;
      background:#4285F4;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#3367D6;
    }

    #resultado{
      margin-top:20px;
      padding:15px;
      background:#e8f0fe;
      border-radius:5px;
      text-align:center;
      font-size:18px;
      font-weight:bold;
      color:#1a73e8;
      display:none;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <h2>Radicación</h2>

  <input type="text" id="asunto" placeholder="Asunto">

  <input type="text" id="destinatario" placeholder="Destinatario">

  <input type="text" id="grado" placeholder="Grado">

  <input type="text" id="nombre" placeholder="Nombres de quien Radica">

  <input type="text" id="telefono" placeholder="Número Telefónico">

  <input type="email" id="correo" placeholder="Correo Dependencia">

  <button onclick="enviar()">Enviar Información</button>

  <div id="resultado"></div>

</div>

<script>

function enviar(){

  const datos = {

    asunto: document.getElementById("asunto").value,
    destinatario: document.getElementById("destinatario").value,
    grado: document.getElementById("grado").value,
    nombre: document.getElementById("nombre").value,
    telefono: document.getElementById("telefono").value,
    correo: document.getElementById("correo").value

  };

  google.script.run
    .withSuccessHandler(function(resultado){

      document.getElementById("resultado").style.display = "block";

      document.getElementById("resultado").innerHTML =
        "Radicado generado:<br><br>" + resultado;

      // LIMPIAR CAMPOS
      document.getElementById("asunto").value = "";
      document.getElementById("destinatario").value = "";
      document.getElementById("grado").value = "";
      document.getElementById("nombre").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("correo").value = "";

    })
    .guardarDatos(datos);

}

</script>

</body>
</html>
