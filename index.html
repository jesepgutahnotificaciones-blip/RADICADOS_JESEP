<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Radicación - Policía Nacional</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Arial, sans-serif;

  background:
    linear-gradient(
      rgba(0,0,0,.75),
      rgba(0,0,0,.75)
    ),
    url('1-fescol-policia-abuso-cilives-1.jpg');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  min-height:100vh;

  color:white;

  padding:20px;
}

.contenedor{

  max-width:900px;

  margin:auto;

  background:rgba(0,0,0,.80);

  border-radius:15px;

  overflow:hidden;

  box-shadow:0 0 20px rgba(0,0,0,.6);

}

.header{

  text-align:center;

  padding:25px;

  background:#0d1b2a;

  border-bottom:3px solid #d4af37;

}

.logo{

  width:120px;

  margin-bottom:15px;
}

.header h1{

  color:#d4af37;

  font-size:30px;

  margin-bottom:10px;
}

.header h2{

  font-size:18px;

  color:white;
}

.tabs{

  display:flex;

  background:#14213d;
}

.tab{

  flex:1;

  padding:15px;

  text-align:center;

  cursor:pointer;

  border-right:1px solid #2c3e50;

  transition:.3s;

  font-weight:bold;
}

.tab:hover{

  background:#1f3b5b;
}

.tab.activa{

  background:#d4af37;

  color:black;
}

.contenido{

  display:none;

  padding:30px;
}

.contenido.activo{

  display:block;
}

.grupo{

  margin-bottom:18px;
}

label{

  display:block;

  margin-bottom:6px;

  font-weight:bold;

  color:#d4af37;
}

input,
select{

  width:100%;

  padding:12px;

  border:none;

  border-radius:5px;

  font-size:15px;
}

button{

  width:100%;

  padding:14px;

  background:#d4af37;

  color:black;

  border:none;

  border-radius:5px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;
}

button:hover{

  background:#f1c40f;
}

#resultado,
#consultaResultado{

  margin-top:20px;

  padding:15px;

  border-radius:5px;

  display:none;

  text-align:center;
}

.ok{

  background:#14532d;
}

.error{

  background:#7f1d1d;
}

.qr-box{

  text-align:center;

  margin-top:20px;
}

.qr-box img{

  background:white;

  padding:10px;

  border-radius:10px;
}

@media(max-width:700px){

  .tabs{
    flex-direction:column;
  }

  .header h1{
    font-size:24px;
  }

}

</style>

</head>

<body>

<div class="contenedor">

<div class="header">

<img
src="https://upload.wikimedia.org/wikipedia/commons/7/70/Emblem_of_the_National_Police_of_Colombia.svg"
class="logo"
>

<h1>POLICÍA NACIONAL DE COLOMBIA</h1>

<h2>Sistema Institucional de Radicación</h2>

</div>

<!-- PESTAÑAS -->

<div class="tabs">

<div class="tab activa"
onclick="mostrarTab('radicacion', this)">
📄 Radicación
</div>

<div class="tab"
onclick="mostrarTab('consulta', this)">
🔍 Consulta
</div>

<div class="tab"
onclick="mostrarTab('qr', this)">
📱 QR
</div>

</div>

<!-- MODULO 1 -->

<div id="radicacion"
class="contenido activo">

<h2 style="margin-bottom:25px;">
Módulo de Radicación
</h2>

<div class="grupo">
<label>Asunto</label>
<input type="text" id="asunto">
</div>

<div class="grupo">
<label>Destinatario</label>
<input type="text" id="destinatario">
</div>

<div class="grupo">
<label>Grado</label>
<input type="text" id="grado">
</div>

<div class="grupo">
<label>Nombre quien Radica</label>
<input type="text" id="nombre">
</div>

<div class="grupo">
<label>Número Telefónico</label>
<input type="text" id="telefono">
</div>

<div class="grupo">
<label>Correo Dependencia</label>
<input type="email" id="correo">
</div>

<!-- NUEVO -->

<div class="grupo">

<label>Revisó y Aprobó</label>

<select id="reviso">

<option value="">
Seleccione una opción
</option>

<option value="MY. TIQUE BONILLA EMMA PAOLA">
MY. TIQUE BONILLA EMMA PAOLA
</option>

<option value="TE. LEON MARTINEZ KAREN NATALIA">
TE. LEON MARTINEZ KAREN NATALIA
</option>

</select>

</div>

<div class="grupo">

<label>
Firmado por el jefe de Oficina
</label>

<div style="
display:flex;
gap:30px;
margin-top:10px;
">

<label style="color:white;">

<input
type="radio"
name="firmado"
value="SI"
checked
style="width:auto;"
>

SI

</label>

<label style="color:white;">

<input
type="radio"
name="firmado"
value="NO"
style="width:auto;"
>

NO

</label>

</div>

</div>

<button onclick="enviar()" id="btnEnviar">

Enviar Información

</button>

<div id="resultado"></div>

</div>

<!-- MODULO CONSULTA -->

<div id="consulta"
class="contenido">

<h2 style="margin-bottom:25px;">
Consulta de Radicados
</h2>

<div class="grupo">

<label>Número de Radicado</label>

<input
type="text"
id="radicadoBuscar"
placeholder="Ej: RAD-00001"
>

</div>

<button onclick="consultarRadicado()">

Consultar Radicado

</button>

<div id="consultaResultado"></div>

</div>

<!-- MODULO QR -->

<div id="qr"
class="contenido">

<h2 style="margin-bottom:25px;">
Generador Código QR
</h2>

<div class="grupo">

<label>Ingrese Radicado</label>

<input
type="text"
id="textoQR"
placeholder="RAD-00001"
>

</div>

<button onclick="generarQR()">

Generar QR

</button>

<div class="qr-box" id="qrResultado"></div>

</div>

</div>

<script>

function mostrarTab(id, elemento){

  document
    .querySelectorAll(".contenido")
    .forEach(c => {
      c.classList.remove("activo");
    });

  document
    .querySelectorAll(".tab")
    .forEach(t => {
      t.classList.remove("activa");
    });

  document
    .getElementById(id)
    .classList.add("activo");

  elemento.classList.add("activa");

}



async function enviar(){

  const boton =
    document.getElementById("btnEnviar");

  const resultado =
    document.getElementById("resultado");

  boton.disabled = true;

  boton.innerHTML = "Enviando...";

  const datos = {

    asunto:
      document.getElementById("asunto").value,

    destinatario:
      document.getElementById("destinatario").value,

    grado:
      document.getElementById("grado").value,

    nombre:
      document.getElementById("nombre").value,

    telefono:
      document.getElementById("telefono").value,

    correo:
      document.getElementById("correo").value,

    reviso:
      document.getElementById("reviso").value,

    firmado:
      document.querySelector(
        'input[name="firmado"]:checked'
      ).value

  };

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzRmDGn0yNkQ0hWLatvaf54ZZuJyDW6FycJpmZlonlhSRmhtUlh9WNqReTtD2lOJb1ikw/exec",
      {
        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify(datos)
      }
    );

    const data =
      await response.json();

    resultado.style.display = "block";

    if(data.success){

      resultado.className = "ok";

      resultado.innerHTML =
        "Información enviada correctamente.<br><br>" +
        "Radicado generado:<br><strong>" +
        data.radicado +
        "</strong>";

    } else {

      resultado.className = "error";

      resultado.innerHTML =
        data.error;

    }

  } catch(error){

    resultado.style.display = "block";

    resultado.className = "error";

    resultado.innerHTML =
      error.toString();

  }

  boton.disabled = false;

  boton.innerHTML =
    "Enviar Información";

}



function consultarRadicado(){

  const radicado =
    document.getElementById("radicadoBuscar").value;

  const resultado =
    document.getElementById("consultaResultado");

  resultado.style.display = "block";

  resultado.className = "ok";

  resultado.innerHTML =
    "Consulta solicitada para:<br><strong>" +
    radicado +
    "</strong>";

}



function generarQR(){

  const texto =
    document.getElementById("textoQR").value;

  const qr =
    document.getElementById("qrResultado");

  qr.innerHTML =

    "<img src='https://chart.googleapis.com/chart?chs=250x250&cht=qr&chl="
    + encodeURIComponent(texto) +
    "'>";

}

</script>

</body>
</html>
