<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Radicación - Policía Nacional</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:
    "Segoe UI",
    Tahoma,
    Geneva,
    Verdana,
    sans-serif;

  background:
    linear-gradient(
      rgba(0,0,0,.82),
      rgba(0,0,0,.82)
    ),
    url('1-fescol-policia-abuso-cilives-1.jpg');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  min-height:100vh;

  color:white;

  padding:20px;
}

/* CONTENEDOR */

.contenedor{

  max-width:1000px;

  margin:auto;

  background:
    rgba(10,15,25,.78);

  backdrop-filter:blur(10px);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 8px 40px rgba(0,0,0,.7);

}

/* HEADER */

.header{

  text-align:center;

  padding:35px 20px;

  background:
    linear-gradient(
      90deg,
      #0b1320,
      #132238
    );

  border-bottom:
    4px solid #d4af37;
}

.logo{

  width:120px;

  margin-bottom:15px;

  filter:
    drop-shadow(0 0 10px rgba(255,255,255,.15));
}

.header h1{

  color:#d4af37;

  font-size:34px;

  letter-spacing:1px;

  margin-bottom:10px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

.header h2{

  color:#dfe6ee;

  font-size:18px;

  font-weight:400;
}

/* TABS */

.tabs{

  display:flex;

  background:#111b2d;
}

.tab{

  flex:1;

  padding:18px;

  text-align:center;

  cursor:pointer;

  transition:.3s;

  font-weight:600;

  border-right:
    1px solid rgba(255,255,255,.08);
}

.tab:last-child{
  border-right:none;
}

.tab:hover{

  background:#1f3555;
}

.tab.activa{

  background:#d4af37;

  color:black;

  font-weight:bold;
}

/* CONTENIDO */

.contenido{

  display:none;

  padding:35px;
}

.contenido.activo{

  display:block;
}

.contenido h2{

  margin-bottom:25px;

  color:#d4af37;

  border-left:
    5px solid #d4af37;

  padding-left:12px;
}

/* FORMULARIOS */

.grupo{

  margin-bottom:20px;
}

label{

  display:block;

  margin-bottom:8px;

  font-weight:600;

  color:#f4d35e;
}

input,
select{

  width:100%;

  padding:14px;

  border-radius:10px;

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:15px;

  transition:.3s;
}

input:focus,
select:focus{

  outline:none;

  border:
    1px solid #d4af37;

  background:
    rgba(255,255,255,.10);
}

input::placeholder{

  color:#c7c7c7;
}

option{
  color:black;
}

/* BOTONES */

button{

  width:100%;

  padding:15px;

  border:none;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #d4af37,
      #f1c40f
    );

  color:black;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;

  box-shadow:
    0 4px 15px rgba(212,175,55,.25);
}

button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 6px 20px rgba(212,175,55,.45);
}

/* RESULTADOS */

#resultado,
#consultaResultado{

  margin-top:25px;

  padding:18px;

  border-radius:10px;

  display:none;

  line-height:1.8;

  font-size:16px;
}

.ok{

  background:
    rgba(22,101,52,.8);

  border:
    1px solid #22c55e;
}

.error{

  background:
    rgba(127,29,29,.8);

  border:
    1px solid #ef4444;
}

/* QR */

.qr-box{

  text-align:center;

  margin-top:25px;
}

.qr-box img{

  background:white;

  padding:15px;

  border-radius:15px;

  box-shadow:
    0 0 20px rgba(255,255,255,.15);
}

/* RESPONSIVE */

@media(max-width:768px){

  body{
    padding:10px;
  }

  .tabs{
    flex-direction:column;
  }

  .header h1{
    font-size:25px;
  }

  .header h2{
    font-size:15px;
  }

  .contenido{
    padding:20px;
  }

}

</style>

</head>

<body>

<div class="contenedor">

<div class="header">

<img
src="Escudo_Policía_Nacional_de_Colombia.png"
class="logo"
>

<h1>POLICÍA NACIONAL DE COLOMBIA</h1>

<h2>Sistema Institucional de Radicación</h2>

</div>

<!-- PESTAÑAS -->

<div class="tabs">

<div class="tab activa"
onclick="mostrarTab('radicacion', this)">
📄 Radicación
</div>

<div class="tab"
onclick="mostrarTab('consulta', this)">
🔍 Consulta
</div>

<div class="tab"
onclick="mostrarTab('qr', this)">
📱 QR
</div>

</div>

<!-- MODULO RADICACION -->

<div id="radicacion"
class="contenido activo">

<h2>Módulo de Radicación</h2>

<div class="grupo">
<label>Asunto</label>
<input type="text" id="asunto">
</div>

<div class="grupo">
<label>Destinatario</label>
<input type="text" id="destinatario">
</div>

<div class="grupo">
<label>Grado</label>
<input type="text" id="grado">
</div>

<div class="grupo">
<label>Nombre quien Radica</label>
<input type="text" id="nombre">
</div>

<div class="grupo">
<label>Número Telefónico</label>
<input type="text" id="telefono">
</div>

<div class="grupo">
<label>Correo Dependencia</label>
<input type="email" id="correo">
</div>

<div class="grupo">

<label>Revisó y Aprobó</label>

<select id="reviso">

<option value="">
Seleccione una opción
</option>

<option value="MY. TIQUE BONILLA EMMA PAOLA">
MY. TIQUE BONILLA EMMA PAOLA
</option>

<option value="TE. LEON MARTINEZ KAREN NATALIA">
TE. LEON MARTINEZ KAREN NATALIA
</option>

</select>

</div>

<div class="grupo">

<label>
Firmado por el jefe de Oficina
</label>

<div style="
display:flex;
gap:30px;
margin-top:10px;
">

<label style="color:white;">

<input
type="radio"
name="firmado"
value="SI"
checked
style="width:auto;"
>

SI

</label>

<label style="color:white;">

<input
type="radio"
name="firmado"
value="NO"
style="width:auto;"
>

NO

</label>

</div>

</div>

<button onclick="enviar()" id="btnEnviar">

Enviar Información

</button>

<div id="resultado"></div>

</div>

<!-- MODULO CONSULTA -->

<div id="consulta"
class="contenido">

<h2>Consulta de Radicados</h2>

<div class="grupo">

<label>Número de Radicado</label>

<input
type="text"
id="radicadoBuscar"
placeholder="Ej: RAD-00001"
>

</div>

<button onclick="consultarRadicado()">

Consultar Radicado

</button>

<div id="consultaResultado"></div>

</div>

<!-- MODULO QR -->

<div id="qr"
class="contenido">

<h2>Generador Código QR</h2>

<div class="grupo">

<label>Ingrese Radicado</label>

<input
type="text"
id="textoQR"
placeholder="RAD-00001"
>

</div>

<button onclick="generarQR()">

Generar QR

</button>

<div class="qr-box" id="qrResultado"></div>

</div>

</div>

<script>

function mostrarTab(id, elemento){

  document
    .querySelectorAll(".contenido")
    .forEach(c => {
      c.classList.remove("activo");
    });

  document
    .querySelectorAll(".tab")
    .forEach(t => {
      t.classList.remove("activa");
    });

  document
    .getElementById(id)
    .classList.add("activo");

  elemento.classList.add("activa");

}



async function enviar(){

  const boton =
    document.getElementById("btnEnviar");

  const resultado =
    document.getElementById("resultado");

  boton.disabled = true;

  boton.innerHTML = "Enviando...";

  const datos = {

    asunto:
      document.getElementById("asunto").value,

    destinatario:
      document.getElementById("destinatario").value,

    grado:
      document.getElementById("grado").value,

    nombre:
      document.getElementById("nombre").value,

    telefono:
      document.getElementById("telefono").value,

    correo:
      document.getElementById("correo").value,

    reviso:
      document.getElementById("reviso").value,

    firmado:
      document.querySelector(
        'input[name="firmado"]:checked'
      ).value

  };

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbxVH7XF7cTms_1D534OfgQTKTBjkxhbLSmNxyYXkawK-xudwoJG1hkYSDPUnfXTAEdx_g/exec",
      {
        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify(datos)
      }
    );

    const data =
      await response.json();

    resultado.style.display = "block";

    if(data.success){

      resultado.className = "ok";

      resultado.innerHTML =
        "✅ Información enviada correctamente.<br><br>" +
        "📄 Radicado generado:<br><strong>" +
        data.radicado +
        "</strong>";

      document.getElementById("asunto").value = "";
      document.getElementById("destinatario").value = "";
      document.getElementById("grado").value = "";
      document.getElementById("nombre").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("correo").value = "";
      document.getElementById("reviso").value = "";

    } else {

      resultado.className = "error";

      resultado.innerHTML =
        "❌ " + data.error;

    }

  } catch(error){

    resultado.style.display = "block";

    resultado.className = "error";

    resultado.innerHTML =
      "❌ Error de conexión.";

  }

  boton.disabled = false;

  boton.innerHTML =
    "Enviar Información";

}



async function consultarRadicado(){

  const radicado =
    document.getElementById("radicadoBuscar").value;

  const resultado =
    document.getElementById("consultaResultado");

  resultado.style.display = "block";

  resultado.innerHTML =
    "Consultando...";

  try {

    const response =
      await fetch(
        "https://script.google.com/macros/s/AKfycbxVH7XF7cTms_1D534OfgQTKTBjkxhbLSmNxyYXkawK-xudwoJG1hkYSDPUnfXTAEdx_g/exec?radicado="
        + encodeURIComponent(radicado)
      );

    const data =
      await response.json();

    if(data.success){

      resultado.className = "ok";

      resultado.innerHTML =

        "<strong>📄 INFORMACIÓN DEL RADICADO</strong><br><br>" +

        "<strong>Radicado:</strong> "
        + data.radicado + "<br><br>" +

        "<strong>Asunto:</strong> "
        + data.asunto + "<br><br>" +

        "<strong>Destinatario:</strong> "
        + data.destinatario + "<br><br>" +

        "<strong>Fecha y hora del envío:</strong> "
        + data.fecha + "<br><br>" +

        "<strong>Nombre quien Radicó:</strong> "
        + data.nombre + "<br><br>" +

        "<strong>Nro. Telefónico:</strong> "
        + data.telefono + "<br><br>" +

        "<strong>Correo:</strong> "
        + data.correo + "<br><br>" +

        "<strong>Quien Revisó:</strong> "
        + data.reviso + "<br><br>" +

        "<strong>Firmado jefe oficina:</strong> "
        + data.firmado;

    } else {

      resultado.className = "error";

      resultado.innerHTML =
        "❌ " + data.error;

    }

  } catch(error){

    resultado.className = "error";

    resultado.innerHTML =
      "❌ Error consultando radicado.";

  }

}



function generarQR(){

  const texto =
    document.getElementById("textoQR").value;

  const qr =
    document.getElementById("qrResultado");

  qr.innerHTML =

    "<img src='https://chart.googleapis.com/chart?chs=250x250&cht=qr&chl="
    + encodeURIComponent(texto) +
    "'>";

}

</script>

</body>
</html>
