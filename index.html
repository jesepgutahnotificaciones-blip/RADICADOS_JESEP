```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<base target="_top">

<title>Sistema de Radicación</title>

<style>

body{

font-family:Arial;

background:#f4f4f4;

padding:20px;
}

.contenedor{

background:white;

max-width:550px;

margin:auto;

padding:25px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{

text-align:center;

color:#1a73e8;

margin-bottom:20px;
}

.grupo{

margin-bottom:15px;
}

input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:5px;

box-sizing:border-box;

font-size:15px;
}

input:focus{

outline:none;

border:1px solid #4285F4;
}

button{

width:100%;

padding:14px;

margin-top:10px;

border:none;

border-radius:5px;

background:#4285F4;

color:white;

font-size:16px;

cursor:pointer;
}

button:hover{

background:#3367D6;
}

button:disabled{

background:#9bbcf7;

cursor:not-allowed;
}

#resultado{

margin-top:20px;

padding:15px;

border-radius:5px;

text-align:center;

font-size:17px;

font-weight:bold;

display:none;
}

.ok{

background:#e6f4ea;

color:#137333;
}

.error{

background:#fce8e6;

color:#c5221f;
}

</style>

</head>

<body>

<div class="contenedor">

<h2>Formulario de Radicación</h2>

<div class="grupo">
<input
type="text"
id="asunto"
placeholder="Asunto *">
</div>

<div class="grupo">
<input
type="text"
id="destinatario"
placeholder="Destinatario *">
</div>

<div class="grupo">
<input
type="text"
id="grado"
placeholder="Grado *">
</div>

<div class="grupo">
<input
type="text"
id="nombre"
placeholder="Nombres de quien Radica *">
</div>

<div class="grupo">
<input
type="text"
id="telefono"
placeholder="Número Telefónico *">
</div>

<div class="grupo">
<input
type="email"
id="correo"
placeholder="Correo Dependencia *">
</div>

<button
onclick="enviar()"
id="btnEnviar">

Enviar Información

</button>

<div id="resultado"></div>

</div>

<script>

function enviar(){

const boton =
document.getElementById(
"btnEnviar"
);

const resultado =
document.getElementById(
"resultado"
);


// CAMPOS

const asunto =
document.getElementById(
"asunto"
);

const destinatario =
document.getElementById(
"destinatario"
);

const grado =
document.getElementById(
"grado"
);

const nombre =
document.getElementById(
"nombre"
);

const telefono =
document.getElementById(
"telefono"
);

const correo =
document.getElementById(
"correo"
);


// VALIDACIÓN

if(
!asunto.value ||
!destinatario.value ||
!grado.value ||
!nombre.value ||
!telefono.value ||
!correo.value
){

resultado.style.display =
"block";

resultado.className =
"error";

resultado.innerHTML =

"❌ Debe diligenciar todos los campos.";

return;

}


// BLOQUEAR BOTÓN

boton.disabled = true;

boton.innerHTML =
"Enviando...";


// DATOS

const datos = {

asunto:
asunto.value,

destinatario:
destinatario.value,

grado:
grado.value,

nombre:
nombre.value,

telefono:
telefono.value,

correo:
correo.value

};


// ENVIAR A APPS SCRIPT

google.script.run

.withSuccessHandler(function(respuesta){

resultado.style.display =
"block";

resultado.className =
"ok";

resultado.innerHTML =

"✅ Radicado generado:<br><br>" +

"<strong>" +

respuesta +

"</strong>";


// LIMPIAR CAMPOS

asunto.value = "";

destinatario.value = "";

grado.value = "";

nombre.value = "";

telefono.value = "";

correo.value = "";


// ACTIVAR BOTÓN

boton.disabled = false;

boton.innerHTML =
"Enviar Información";

})

.withFailureHandler(function(error){

resultado.style.display =
"block";

resultado.className =
"error";

resultado.innerHTML =

"❌ Error enviando información.<br><br>" +

error.message;


// ACTIVAR BOTÓN

boton.disabled = false;

boton.innerHTML =
"Enviar Información";

})

.guardarDatos(datos);

}

</script>

</body>
</html>
