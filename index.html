<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <style>

    body{
      font-family:Arial;
      background:#f1f1f1;
      padding:20px;
    }

    .contenedor{
      max-width:500px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,.1);
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      margin-top:15px;
      padding:14px;
      background:#4285F4;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#3367D6;
    }

    #resultado{
      margin-top:20px;
      padding:15px;
      background:#E8F0FE;
      border-radius:5px;
      display:none;
      text-align:center;
      font-weight:bold;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h2>Formulario Radicación</h2>

  <input type="text" id="asunto" placeholder="Asunto">

  <input type="text" id="destinatario" placeholder="Destinatario">

  <input type="text" id="grado" placeholder="Grado">

  <input type="text" id="nombre" placeholder="Nombre quien radica">

  <input type="text" id="telefono" placeholder="Número telefónico">

  <input type="email" id="correo" placeholder="Correo dependencia">

  <button onclick="enviar()">Enviar Información</button>

  <div id="resultado"></div>

</div>

<script>

function enviar(){

  const boton = document.querySelector("button");

  boton.disabled = true;
  boton.innerHTML = "Enviando...";

  const datos = {

    asunto: document.getElementById("asunto").value,
    destinatario: document.getElementById("destinatario").value,
    grado: document.getElementById("grado").value,
    nombre: document.getElementById("nombre").value,
    telefono: document.getElementById("telefono").value,
    correo: document.getElementById("correo").value

  };

  google.script.run

    .withSuccessHandler(function(respuesta){

      document.getElementById("resultado").style.display = "block";

      document.getElementById("resultado").innerHTML =
        "Resultado columna C:<br><br>" + respuesta;

      boton.disabled = false;
      boton.innerHTML = "Enviar Información";

    })

    .withFailureHandler(function(error){

      alert("Error: " + error.message);

      boton.disabled = false;
      boton.innerHTML = "Enviar Información";

    })

    .guardarDatos(datos);

}

</script>

</body>
</html>
